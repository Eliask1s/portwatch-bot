name: PortWatch Bot

# Ein Lauf bleibt ~5 Stunden aktiv und prüft darin jede Minute.
# Der Zeitplan sorgt nur dafür, dass immer ein neuer Lauf bereitsteht –
# auch wenn GitHub ihn verspätet startet, gibt es so keine Lücken.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Testnachricht an Discord senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: portwatch            # immer nur ein Lauf aktiv, einer wartet
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PORTWATCH_PING: ${{ secrets.PORTWATCH_PING }}
    steps:
      - uses: actions/checkout@v4

      - name: Testnachricht
        if: ${{ inputs.test }}
        run: python3 portwatch_bot.py --test

      - name: PortWatch beobachten (jede Minute)
        if: ${{ !inputs.test }}
        run: |
          git config user.name "portwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 300*60 ))   # ~5 Stunden
          while [ "$(date +%s)" -lt "$end" ]; do
            python3 -u portwatch_bot.py --once || true
            git add portwatch_state.json
            if ! git diff --cached --quiet; then
              git commit -qm "Stand aktualisiert"
              git pull -q --rebase origin main || true
              git push -q || true
            fi
            sleep 60
          done
